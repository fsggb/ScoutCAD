name: Synchronize ScoutCAD with SolidCraft upstream

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and open update PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: https://github.com/tangency-labs/solidcraft.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch upstream main
          branch="sync/solidcraft-${{ github.run_id }}"
          git switch -c "$branch"
          cp .github/workflows/pages.yml /tmp/pages.yml
          git merge --allow-unrelated-histories -X theirs upstream/main -m "Sync SolidCraft upstream"
          cp /tmp/pages.yml .github/workflows/pages.yml
          perl -0pi -e 's/SolidCraft/ScoutCAD/g; s/<html lang="en">/<html lang="fr">/g' apps/solidcraft-web/index.html apps/solidcraft-web/src/main.rs
          perl -0pi -e 's/let mut app = SolveApp::new\(Session::default\(\), services\)\.with_control\(receiver\);/let mut app = SolveApp::new(Session::default(), services).with_control(receiver);\n                        app.preferences.language = "fr".into();/g' apps/solidcraft-web/src/main.rs
          grep -q 'app.preferences.language = "fr"' apps/solidcraft-web/src/main.rs
          grep -q scouthub-client apps/solidcraft-web/index.html || sed -i 's#</body>#  <script src="/ScoutHub/scouthub-client.js" data-app="ScoutCAD" data-open="event"></script>
</body>#' apps/solidcraft-web/index.html
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync SolidCraft upstream updates"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly SolidCraft upstream sync" \
            --body "Automated weekly synchronization from tangency-labs/solidcraft. Review the upstream changes before merging."
